[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datatrust"
version = "3.0.0"
description = "Task-Aware Decision Support and Data Validation Platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
    "pandas>=2.0.0",
    "scipy>=1.9.0",
    "scikit-learn>=1.2.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "python-multipart>=0.0.6",
    "reportlab>=3.6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0"
]
